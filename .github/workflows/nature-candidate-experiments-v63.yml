      - name: Verify canonical FaIR results
        run: |
          set -euo pipefail

          cd fair_work

          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd

          with open(
              "fair_matched_summary.json",
              encoding="utf-8",
          ) as f:
              summary = json.load(f)

          attr = pd.read_csv(
              "fair_matched_attribution.csv"
          )

          forcing = pd.read_csv(
              "fair_matched_nonco2_forcing.csv"
          )

          timeseries = pd.read_csv(
              "fair_matched_timeseries.csv"
          )

          trajectory = pd.read_csv(
              "external_validation_net_co2_trajectory.csv"
          )

          # -----------------------------
          # Model identity
          # -----------------------------
          assert summary["model"] == "FaIR"
          assert summary["version"] == "2.2.4"
          assert summary["configs"] == 841

          # -----------------------------
          # Canonical trajectory
          # -----------------------------
          canonical_total = float(
              trajectory["cdr_gtco2"].sum()
          )

          canonical_peak = float(
              trajectory["cdr_gtco2"].max()
          )

          assert abs(
              canonical_total
              - 2013.8807318595145
          ) < 1e-6

          assert abs(
              canonical_peak
              - 15.2
          ) < 1e-9

          assert abs(
              summary[
                  "canonical_cdr_2026_2183_gtco2"
              ]
              - canonical_total
          ) < 1e-6

          assert abs(
              summary[
                  "peak_cdr_2026_2183_gtco2_per_year"
              ]
              - canonical_peak
          ) < 1e-9

          # -----------------------------
          # Carbon mass balance
          # -----------------------------
          assert (
              summary[
                  "trajectory_mass_balance_max_abs_gtco2"
              ]
              < 1e-9
          )

          # -----------------------------
          # Common initial state
          # -----------------------------
          assert (
              summary[
                  "common_state_2026_co2_maxabs_ppm"
              ]
              <= 1e-6
          )

          assert (
              summary[
                  "common_state_2026_tas_maxabs_c"
              ]
              <= 1e-6
          )

          # -----------------------------
          # Matched forcing gates
          # -----------------------------
          tol = float(
              summary[
                  "forcing_match_tolerance_wm2"
              ]
          )

          on_error = float(
              summary[
                  "forcing_match_max_abs_on_wm2"
              ]
          )

          off_error = float(
              summary[
                  "forcing_match_max_abs_off_wm2"
              ]
          )

          pair_error = float(
              summary[
                  "forcing_match_on_vs_off_max_abs_wm2"
              ]
          )

          assert on_error <= tol
          assert off_error <= tol
          assert pair_error <= 2 * tol

          # -----------------------------
          # Output structure
          # -----------------------------
          assert len(trajectory) == 158
          assert len(forcing) == 158
          assert len(timeseries) == 158

          assert int(
              forcing["year"].iloc[0]
          ) == 2026

          assert int(
              forcing["year"].iloc[-1]
          ) == 2183

          assert int(
              timeseries["year"].iloc[0]
          ) == 2026

          assert int(
              timeseries["year"].iloc[-1]
          ) == 2183

          assert len(attr) > 400

          assert int(
              round(float(attr["year"].iloc[-1]))
          ) == 2183

          # -----------------------------
          # Numerical sanity
          # -----------------------------
          finite_attr = (
              attr[
                  [
                      "delta_co2_p50_ppm",
                      "fraction_p50",
                  ]
              ]
              .dropna()
              .to_numpy(dtype=float)
          )

          assert np.isfinite(
              finite_attr
          ).all()

          final = attr.iloc[-1]

          # FaIR time-bound convention means the state
          # labelled 2183 contains cumulative CDR through
          # the preceding integration interval. Therefore
          # do NOT require this attribution row itself to
          # equal the full 2026-2183 trajectory total.
          assert (
              float(
                  final[
                      "cumulative_cdr_gtco2"
                  ]
              )
              > 0
          )

          assert (
              float(
                  final[
                      "cumulative_cdr_gtco2"
                  ]
              )
              <= canonical_total
          )

          assert (
              float(
                  final[
                      "delta_co2_p50_ppm"
                  ]
              )
              > 0
          )

          assert (
              float(
                  final[
                      "fraction_p50"
                  ]
              )
              > 0
          )

          print("")
          print(
              "======================================"
          )
          print(
              "V63 CANONICAL FAIR EXPERIMENT PASSED"
          )
          print(
              "======================================"
          )

          print(
              "FaIR configurations:",
              summary["configs"]
          )

          print(
              "Canonical cumulative CDR:",
              canonical_total,
              "GtCO2"
          )

          print(
              "Canonical peak CDR:",
              canonical_peak,
              "GtCO2/yr"
          )

          print(
              "Terminal FaIR year:",
              final["year"]
          )

          print(
              "Terminal median CO2 reduction:",
              final["delta_co2_p50_ppm"],
              "ppm"
          )

          print(
              "Terminal median response fraction:",
              final["fraction_p50"]
          )

          print(
              "ON forcing error:",
              on_error
          )

          print(
              "OFF forcing error:",
              off_error
          )

          print(
              "ON-vs-OFF forcing difference:",
              pair_error
          )
          PY
