name: V63 Preflight — Single Green Job

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: V63 trajectory preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout V63 repository
        uses: actions/checkout@v7

      - name: Restore proven V62.2 canonical trajectory
        run: |
          set -euo pipefail

          V622_DIR="/tmp/V62.2"
          V622_COMMIT="89a0f4ab18df25db3a05d4e39c6db06405456505"

          rm -rf "$V622_DIR"

          git clone \
            https://github.com/bcjohnjr/Planetary-Restoration-Version-62.2.git \
            "$V622_DIR"

          git -C "$V622_DIR" checkout \
            --detach \
            "$V622_COMMIT"

          ACTUAL="$(git -C "$V622_DIR" rev-parse HEAD)"

          test "$ACTUAL" = "$V622_COMMIT"

          cp \
            "$V622_DIR/external_validation_net_co2_trajectory.csv" \
            .

          test -f external_validation_net_co2_trajectory.csv

          echo \
            "f2d58812b8c54bfc52da1dee360ca06f8ccfb888791cf3dc1105bc038ae3a637  external_validation_net_co2_trajectory.csv" \
            | sha256sum -c -

          echo "Pinned V62.2 trajectory restored and verified."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install preflight dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install numpy pandas

          python -m py_compile \
            generate_nature_experiment_trajectories_v63.py

      - name: Generate all predeclared V63 trajectories
        run: |
          set -euo pipefail

          rm -rf nature_experiments

          python generate_nature_experiment_trajectories_v63.py \
            --input external_validation_net_co2_trajectory.csv \
            --outdir nature_experiments/trajectories

      - name: Verify all seven trajectories
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("nature_experiments/trajectories")

          cases = [
              "canonical_peak15p2",
              "scaled_peak5p0",
              "scaled_peak10p0",
              "scaled_peak20p0",
              "same_total_uniform",
              "same_total_peak20_early",
              "same_total_peak20_late",
          ]

          for case in cases:
              path = root / f"{case}.csv"

              assert path.exists(), f"Missing {path}"

              df = pd.read_csv(path)

              assert int(df["year"].min()) == 2026
              assert int(df["year"].max()) == 2183
              assert len(df) == 158
              assert df["year"].is_unique

              identity = (
                  df["gross_co2_gtco2"]
                  + df["permafrost_co2_gtco2"]
                  + df["stored_carbon_reversal_gtco2"]
                  - df["cdr_gtco2"]
              )

              err = (
                  identity
                  - df["net_co2_gtco2"]
              ).abs().max()

              assert err < 1e-9, (case, err)

              print(
                  case,
                  "total_CDR=",
                  float(df["cdr_gtco2"].sum()),
                  "peak=",
                  float(df["cdr_gtco2"].max()),
              )

          canonical = pd.read_csv(
              root / "canonical_peak15p2.csv"
          )

          total = float(
              canonical["cdr_gtco2"].sum()
          )

          peak = float(
              canonical["cdr_gtco2"].max()
          )

          assert abs(
              total - 2013.8807318595145
          ) < 1e-6, total

          assert abs(
              peak - 15.2
          ) < 1e-9, peak

          equal_total_cases = [
              "canonical_peak15p2",
              "same_total_uniform",
              "same_total_peak20_early",
              "same_total_peak20_late",
          ]

          totals = {
              case: float(
                  pd.read_csv(
                      root / f"{case}.csv"
                  )["cdr_gtco2"].sum()
              )
              for case in equal_total_cases
          }

          spread = (
              max(totals.values())
              - min(totals.values())
          )

          assert spread < 1e-9, totals

          print("")
          print("==============================")
          print("V63 PREFLIGHT PASSED")
          print("==============================")
          print(
              "Canonical cumulative CDR:",
              total,
              "GtCO2"
          )
          print(
              "Canonical peak CDR:",
              peak,
              "GtCO2/yr"
          )
          print(
              "Same-total schedule spread:",
              spread,
              "GtCO2"
          )
          PY

      - name: Upload verified trajectories
        uses: actions/upload-artifact@v7
        with:
          name: V63-Verified-Trajectories
          retention-days: 90
          if-no-files-found: error
          path: |
            nature_experiments/trajectories/
