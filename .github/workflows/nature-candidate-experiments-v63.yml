name: V63 Canonical OSCAR Experiment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V622_COMMIT: "89a0f4ab18df25db3a05d4e39c6db06405456505"
  OSCAR_COMMIT: "3ce008400e06363564e5981a35cbc32377d41d86"
  FAIR_RUN_ID: "34653255920"

jobs:
  oscar-canonical:
    name: Canonical OSCAR v3.3
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout V63 repository
        uses: actions/checkout@v7

      - name: Download verified V63 FaIR artifact
        uses: actions/download-artifact@v8
        with:
          name: V63-Canonical-FaIR
          path: fair-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bcjohnjr/Planetary-Restoration_model-V63
          run-id: ${{ env.FAIR_RUN_ID }}

      - name: Verify downloaded FaIR artifact
        run: |
          set -euo pipefail

          test -f fair-artifact/fair_matched_nonco2_forcing.csv
          test -f fair-artifact/fair_matched_attribution.csv
          test -f fair-artifact/fair_matched_timeseries.csv
          test -f fair-artifact/fair_matched_summary.json
          test -f fair-artifact/external_validation_net_co2_trajectory.csv

          python - <<'PY'
          import csv
          import json
          import math

          with open(
              "fair-artifact/fair_matched_summary.json",
              encoding="utf-8",
          ) as f:
              summary = json.load(f)

          with open(
              "fair-artifact/fair_matched_nonco2_forcing.csv",
              newline="",
              encoding="utf-8",
          ) as f:
              forcing = list(csv.DictReader(f))

          with open(
              "fair-artifact/external_validation_net_co2_trajectory.csv",
              newline="",
              encoding="utf-8",
          ) as f:
              trajectory = list(csv.DictReader(f))

          assert summary["model"] == "FaIR"
          assert summary["version"] == "2.2.4"
          assert summary["configs"] == 841

          assert len(forcing) == 158
          assert [int(float(r["year"])) for r in forcing] == list(
              range(2026, 2184)
          )

          assert len(trajectory) == 158
          assert [int(float(r["year"])) for r in trajectory] == list(
              range(2026, 2184)
          )

          total = sum(
              float(row["cdr_gtco2"])
              for row in trajectory
          )

          peak = max(
              float(row["cdr_gtco2"])
              for row in trajectory
          )

          assert abs(
              total - 2013.8807318595145
          ) < 1e-6

          assert abs(
              peak - 15.2
          ) < 1e-9

          mass_error = max(
              abs(
                  (
                      float(row["gross_co2_gtco2"])
                      + float(row["permafrost_co2_gtco2"])
                      + float(row["stored_carbon_reversal_gtco2"])
                      - float(row["cdr_gtco2"])
                  )
                  - float(row["net_co2_gtco2"])
              )
              for row in trajectory
          )

          assert mass_error < 1e-9

          target = [
              float(row["matched_nonco2_forcing_wm2"])
              for row in forcing
          ]

          assert all(math.isfinite(x) for x in target)

          tol = float(
              summary["forcing_match_tolerance_wm2"]
          )

          on_error = float(
              summary["forcing_match_max_abs_on_wm2"]
          )

          off_error = float(
              summary["forcing_match_max_abs_off_wm2"]
          )

          assert on_error <= tol
          assert off_error <= tol

          print(
              "Verified FaIR artifact from green run 34653255920"
          )
          print(
              "Canonical CDR:",
              total,
              "GtCO2"
          )
          print(
              "Peak CDR:",
              peak,
              "GtCO2/yr"
          )
          print(
              "Trajectory mass-balance error:",
              mass_error
          )
          PY

      - name: Restore proven V62.2 OSCAR validation base
        run: |
          set -euo pipefail

          V622_DIR="/tmp/V62.2"

          rm -rf "$V622_DIR"

          git clone \
            https://github.com/bcjohnjr/Planetary-Restoration-Version-62.2.git \
            "$V622_DIR"

          git -C "$V622_DIR" checkout \
            --detach \
            "$V622_COMMIT"

          ACTUAL="$(
            git -C "$V622_DIR" rev-parse HEAD
          )"

          test "$ACTUAL" = "$V622_COMMIT"

          test -f \
            "$V622_DIR/run_oscar_validation_v62.py"

          cp \
            "$V622_DIR/run_oscar_validation_v62.py" \
            run_oscar_validation_v62.py

          echo "Pinned V62.2 OSCAR validation base restored."

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Verify V63 OSCAR scripts
        run: |
          set -euo pipefail

          test -f run_oscar_matched_forcing_v63.py
          test -f run_oscar_validation_v62.py

          python -m py_compile \
            run_oscar_matched_forcing_v63.py \
            run_oscar_validation_v62.py

          echo "V63 OSCAR Python syntax verified."

      - name: Install OSCAR v3.3 runtime dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade 'pip<25'

          pip install \
            'numpy==1.23.3' \
            'scipy==1.9.3' \
            'pandas==1.5.3' \
            'xarray==0.20.1' \
            'matplotlib==3.7.5' \
            'netCDF4==1.6.5' \
            'h5netcdf==1.3.0' \
            'h5py==3.10.0'

      - name: Verify OSCAR Python dependencies
        run: |
          set -euo pipefail

          python - <<'PY'
          import h5netcdf
          import h5py
          import matplotlib
          import netCDF4
          import numpy
          import pandas
          import scipy
          import xarray

          print("numpy:", numpy.__version__)
          print("scipy:", scipy.__version__)
          print("pandas:", pandas.__version__)
          print("xarray:", xarray.__version__)
          print("matplotlib:", matplotlib.__version__)
          print("netCDF4:", netCDF4.__version__)
          print("h5netcdf:", h5netcdf.__version__)
          print("h5py:", h5py.__version__)

          assert numpy.__version__ == "1.23.3"
          assert scipy.__version__ == "1.9.3"
          assert pandas.__version__ == "1.5.3"
          assert xarray.__version__ == "0.20.1"

          print("OSCAR Python dependencies verified.")
          PY

      - name: Fetch pinned official OSCAR v3.3 source
        run: |
          set -euo pipefail

          rm -rf _oscar

          git clone \
            https://github.com/tgasser/OSCAR.git \
            _oscar

          git -C _oscar checkout \
            --detach \
            "$OSCAR_COMMIT"

          ACTUAL="$(
            git -C _oscar rev-parse HEAD
          )"

          test "$ACTUAL" = "$OSCAR_COMMIT"

          echo "Pinned OSCAR source verified: $ACTUAL"

      - name: Verify OSCAR parameter files
        run: |
          set -euo pipefail

          python - <<'PY'
          import xarray as xr

          path = (
              "_oscar/input_data/parameters/"
              "from_OSCARv2/ocean_CMIP5.nc"
          )

          ds = xr.open_dataset(path)

          print(ds)

          ds.close()

          print(
              "OSCAR NetCDF parameter file successfully opened."
          )
          PY

      - name: Verify canonical OSCAR inputs
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas as pd
          import numpy as np

          traj = pd.read_csv(
              "fair-artifact/"
              "external_validation_net_co2_trajectory.csv"
          ).sort_values("year")

          forcing = pd.read_csv(
              "fair-artifact/"
              "fair_matched_nonco2_forcing.csv"
          ).sort_values("year")

          assert traj["year"].astype(int).tolist() == list(
              range(2026, 2184)
          )

          assert forcing["year"].astype(int).tolist() == list(
              range(2026, 2184)
          )

          assert np.isfinite(
              forcing[
                  "matched_nonco2_forcing_wm2"
              ].to_numpy(float)
          ).all()

          total = float(
              traj["cdr_gtco2"].sum()
          )

          peak = float(
              traj["cdr_gtco2"].max()
          )

          assert abs(
              total - 2013.8807318595145
          ) < 1e-6

          assert abs(
              peak - 15.2
          ) < 1e-9

          assert float(
              traj.loc[
                  traj["year"] == 2026,
                  "cdr_gtco2"
              ].iloc[0]
          ) == 0.0

          print(
              "Canonical OSCAR inputs verified."
          )
          print(
              "2027-2183 cumulative CDR:",
              total,
              "GtCO2"
          )
          PY

      - name: Run canonical OSCAR matched-forcing experiment
        run: |
          set -euo pipefail

          rm -rf oscar_matched_results

          python run_oscar_matched_forcing_v63.py \
            --oscar-root "$GITHUB_WORKSPACE/_oscar" \
            --trajectory "$GITHUB_WORKSPACE/fair-artifact/external_validation_net_co2_trajectory.csv" \
            --forcing-target "$GITHUB_WORKSPACE/fair-artifact/fair_matched_nonco2_forcing.csv" \
            --outdir "$GITHUB_WORKSPACE/oscar_matched_results" \
            --nmc 200 \
            --end-year 2183 \
            --forcing-tol 1e-4 \
            --max-iters 6 \
            2>&1 | tee OSCAR_CANONICAL_CONSOLE.log

      - name: Verify canonical OSCAR results
        run: |
          set -euo pipefail

          test -f \
            oscar_matched_results/oscar_matched_attribution.csv

          test -f \
            oscar_matched_results/oscar_reservoir_decomposition.csv

          test -f \
            oscar_matched_results/oscar_matched_timeseries.csv

          test -f \
            oscar_matched_results/oscar_forcing_match_audit.csv

          test -f \
            oscar_matched_results/oscar_matched_summary.json

          python - <<'PY'
          import json
          import math
          import pandas as pd
          import numpy as np

          root = "oscar_matched_results"

          with open(
              f"{root}/oscar_matched_summary.json",
              encoding="utf-8",
          ) as f:
              summary = json.load(f)

          attr = pd.read_csv(
              f"{root}/oscar_matched_attribution.csv"
          )

          reservoir = pd.read_csv(
              f"{root}/oscar_reservoir_decomposition.csv"
          )

          timeseries = pd.read_csv(
              f"{root}/oscar_matched_timeseries.csv"
          )

          audit = pd.read_csv(
              f"{root}/oscar_forcing_match_audit.csv"
          )

          assert summary["status"] == "PASS"

          assert (
              summary["experiment"]
              == "V63_OSCAR_COMMON_NONCO2_MATCH_AND_RESERVOIR_DECOMPOSITION"
          )

          assert summary["oscar_version"] == "v3.3"

          assert (
              summary["oscar_pinned_commit"]
              == "3ce008400e06363564e5981a35cbc32377d41d86"
          )

          assert summary["ensemble_members"] == 200
          assert summary["seed"] == 6201
          assert summary["years"] == [2027, 2183]

          protocol = summary["forcing_protocol"]

          tol = float(
              protocol["tolerance_wm2"]
          )

          on_error = float(
              protocol[
                  "on_max_abs_median_error_wm2"
              ]
          )

          off_error = float(
              protocol[
                  "off_max_abs_median_error_wm2"
              ]
          )

          assert abs(tol - 1e-4) < 1e-15
          assert on_error <= tol
          assert off_error <= tol

          canonical = float(
              summary[
                  "canonical_cdr_2027_2183_gtco2"
              ]
          )

          assert abs(
              canonical - 2013.8807318595145
          ) < 1e-6

          final_delta = float(
              summary[
                  "final_2183_delta_co2_p50_ppm"
              ]
          )

          final_fraction = float(
              summary[
                  "final_2183_response_fraction_p50"
              ]
          )

          assert math.isfinite(final_delta)
          assert math.isfinite(final_fraction)
          assert final_delta > 0.0
          assert final_fraction > 0.0

          gates = summary["gates"]

          assert gates
          assert all(
              value is True
              for value in gates.values()
          )

          expected_years = list(
              range(2027, 2184)
          )

          for name, frame in (
              ("attribution", attr),
              ("reservoir", reservoir),
              ("timeseries", timeseries),
          ):
              years = frame["year"].astype(int).tolist()

              assert years == expected_years, (
                  name,
                  years[:3],
                  years[-3:],
              )

              assert len(frame) == 157

          assert set(
              audit["case"].astype(str)
          ) == {
              "removal_ON",
              "removal_OFF",
          }

          assert len(audit) >= 2

          assert np.isfinite(
              attr[
                  [
                      "cumulative_cdr_gtco2",
                      "delta_co2_p05_ppm",
                      "delta_co2_p50_ppm",
                      "delta_co2_p95_ppm",
                      "fraction_p05",
                      "fraction_p50",
                      "fraction_p95",
                  ]
              ].to_numpy(float)
          ).all()

          assert np.isfinite(
              reservoir.select_dtypes(
                  include=[np.number]
              ).to_numpy(float)
          ).all()

          assert np.isfinite(
              timeseries.select_dtypes(
                  include=[np.number]
              ).to_numpy(float)
          ).all()

          final_attr = attr.iloc[-1]

          assert int(
              final_attr["year"]
          ) == 2183

          assert abs(
              float(
                  final_attr[
                      "cumulative_cdr_gtco2"
                  ]
              )
              - 2013.8807318595145
          ) < 1e-6

          assert float(
              final_attr["delta_co2_p50_ppm"]
          ) > 0.0

          assert float(
              final_attr["fraction_p50"]
          ) > 0.0

          print(
              "Canonical OSCAR v3.3 results verified."
          )
          print(
              "ON forcing-match error:",
              on_error,
              "W/m2"
          )
          print(
              "OFF forcing-match error:",
              off_error,
              "W/m2"
          )
          print(
              "2183 median CO2 benefit:",
              final_delta,
              "ppm"
          )
          print(
              "2183 median response fraction:",
              final_fraction
          )
          PY

      - name: Show OSCAR canonical summary
        if: always()
        run: |
          if [ -f oscar_matched_results/oscar_matched_summary.json ]; then
            cat oscar_matched_results/oscar_matched_summary.json
          else
            echo "OSCAR canonical summary was not generated."
          fi

      - name: List OSCAR result files
        if: always()
        run: |
          if [ -d oscar_matched_results ]; then
            find oscar_matched_results -maxdepth 2 -type f -print
          else
            echo "No oscar_matched_results directory exists."
          fi

      - name: Upload canonical OSCAR artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: V63-Canonical-OSCAR
          path: |
            oscar_matched_results/
            OSCAR_CANONICAL_CONSOLE.log
            fair-artifact/fair_matched_nonco2_forcing.csv
            fair-artifact/external_validation_net_co2_trajectory.csv
            run_oscar_matched_forcing_v63.py
            run_oscar_validation_v62.py
          if-no-files-found: warn
