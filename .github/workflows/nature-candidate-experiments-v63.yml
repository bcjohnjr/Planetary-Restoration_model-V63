name: V63 Canonical Hector Experiment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V622_COMMIT: "89a0f4ab18df25db3a05d4e39c6db06405456505"

jobs:
  hector-canonical:
    name: Canonical Hector 3.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout V63 repository
        uses: actions/checkout@v7

      - name: Download verified V63 FaIR artifact
        uses: actions/download-artifact@v8
        with:
          name: V63-Canonical-FaIR
          path: fair-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bcjohnjr/Planetary-Restoration_model-V63
          run-id: 34653255920

      - name: Verify downloaded FaIR artifact
        run: |
          set -euo pipefail

          test -f fair-artifact/fair_matched_nonco2_forcing.csv
          test -f fair-artifact/fair_matched_attribution.csv
          test -f fair-artifact/fair_matched_timeseries.csv
          test -f fair-artifact/fair_matched_summary.json
          test -f fair-artifact/external_validation_net_co2_trajectory.csv

          python - <<'PY'
          import csv
          import json

          with open(
              "fair-artifact/fair_matched_summary.json",
              encoding="utf-8",
          ) as f:
              summary = json.load(f)

          with open(
              "fair-artifact/fair_matched_nonco2_forcing.csv",
              newline="",
              encoding="utf-8",
          ) as f:
              forcing = list(csv.DictReader(f))

          with open(
              "fair-artifact/external_validation_net_co2_trajectory.csv",
              newline="",
              encoding="utf-8",
          ) as f:
              trajectory = list(csv.DictReader(f))

          assert summary["model"] == "FaIR"
          assert summary["version"] == "2.2.4"
          assert summary["configs"] == 841

          assert len(forcing) == 158
          assert int(float(forcing[0]["year"])) == 2026
          assert int(float(forcing[-1]["year"])) == 2183

          assert len(trajectory) == 158
          assert int(float(trajectory[0]["year"])) == 2026
          assert int(float(trajectory[-1]["year"])) == 2183

          total = sum(
              float(row["cdr_gtco2"])
              for row in trajectory
          )

          peak = max(
              float(row["cdr_gtco2"])
              for row in trajectory
          )

          assert abs(
              total - 2013.8807318595145
          ) < 1e-6

          assert abs(
              peak - 15.2
          ) < 1e-9

          tol = float(
              summary["forcing_match_tolerance_wm2"]
          )

          on_error = float(
              summary["forcing_match_max_abs_on_wm2"]
          )

          off_error = float(
              summary["forcing_match_max_abs_off_wm2"]
          )

          assert on_error <= tol
          assert off_error <= tol

          print(
              "Verified FaIR artifact from green run 34653255920"
          )

          print(
              "Canonical CDR:",
              total,
              "GtCO2"
          )

          print(
              "Peak CDR:",
              peak,
              "GtCO2/yr"
          )
          PY

      - name: Restore proven V62.2 Hector script
        run: |
          set -euo pipefail

          V622_DIR="/tmp/V62.2"

          rm -rf "$V622_DIR"

          git clone \
            https://github.com/bcjohnjr/Planetary-Restoration-Version-62.2.git \
            "$V622_DIR"

          git -C "$V622_DIR" checkout \
            --detach \
            "$V622_COMMIT"

          ACTUAL="$(
            git -C "$V622_DIR" rev-parse HEAD
          )"

          test "$ACTUAL" = "$V622_COMMIT"

          test -f \
            "$V622_DIR/run_hector_matched_forcing_v62.R"

          rm -rf hector_work
          mkdir -p hector_work

          cp \
            "$V622_DIR/run_hector_matched_forcing_v62.R" \
            hector_work/run_hector_matched_forcing_v63.R

          cp \
            fair-artifact/fair_matched_nonco2_forcing.csv \
            hector_work/

          cp \
            fair-artifact/external_validation_net_co2_trajectory.csv \
            hector_work/

          echo "Pinned V62.2 Hector script restored."

      - name: Patch Hector for true V63 2183 horizon
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "hector_work/run_hector_matched_forcing_v63.R"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          print(
              "Original 2300 references:",
              text.count("2300")
          )

          # --------------------------------------------------
          # 1. Remove V62's artificial extension of the
          #    canonical trajectory from 2183 through 2300.
          #    Regex is whitespace tolerant.
          # --------------------------------------------------

          extension_pattern = re.compile(
              r"""
              \n
              \s*last\s*<-\s*x\[nrow\(x\),\s*\]
              \s*
              if\s*\(\s*max\(x\$year\)\s*<\s*2300\s*\)
              \s*\{
              .*?
              \n\s*\}
              \s*
              (?=yrs\s*<-\s*as\.numeric\(x\$year\))
              """,
              re.VERBOSE | re.DOTALL,
          )

          text, n_extension = extension_pattern.subn(
              "\n",
              text,
              count=1,
          )

          if n_extension != 1:
              raise SystemExit(
                  "Failed to remove exactly one "
                  "V62 2183-to-2300 extension block. "
                  f"Matches={n_extension}"
              )

          print(
              "Removed trajectory extension block."
          )

          # --------------------------------------------------
          # 2. Require actual trajectory to be 2026-2183.
          # --------------------------------------------------

          text, n_year_check = re.subn(
              r"as\.numeric\(\s*2026\s*:\s*2300\s*\)",
              "as.numeric(2026:2183)",
              text,
              count=1,
          )

          if n_year_check != 1:
              raise SystemExit(
                  "Failed to patch 2026:2300 year check."
              )

          # --------------------------------------------------
          # 3. Match FaIR non-CO2 forcing only over
          #    2027-2183.
          # --------------------------------------------------

          text, n_match = re.subn(
              r"match_years\s*<-\s*2027\s*:\s*2300",
              "match_years <- 2027:2183",
              text,
              count=1,
          )

          if n_match != 1:
              raise SystemExit(
                  "Failed to patch match_years."
              )

          # --------------------------------------------------
          # 4. Stop Hector at 2183 rather than 2300.
          # --------------------------------------------------

          run_pattern = re.compile(
              r"""
              run
              \s*\(
              \s*core
              \s*,\s*
              2300
              \s*\)
              """,
              re.VERBOSE,
          )

          text, n_run = run_pattern.subn(
              "run(\n      core,\n      2183\n    )",
              text,
              count=1,
          )

          if n_run != 1:
              raise SystemExit(
                  "Failed to patch Hector run horizon."
              )

          # --------------------------------------------------
          # 5. Replace the old milestone set.
          # --------------------------------------------------

          milestone_pattern = re.compile(
              r"""
              yy\s+in\s+c
              \s*\(
              \s*2040\s*,
              \s*2100\s*,
              \s*2156\s*,
              \s*2184\s*,
              \s*2200\s*,
              \s*2300\s*
              \)
              """,
              re.VERBOSE,
          )

          milestone_replacement = """yy in c(
              2040,
              2100,
              2156,
              2183
            )"""

          text, n_milestones = milestone_pattern.subn(
              milestone_replacement,
              text,
              count=1,
          )

          if n_milestones != 1:
              raise SystemExit(
                  "Failed to patch milestone years."
              )

          # --------------------------------------------------
          # 6. Update descriptive/error strings.
          # --------------------------------------------------

          text = text.replace(
              "2026-2300",
              "2026-2183"
          )

          text = text.replace(
              "2027-2300",
              "2027-2183"
          )

          text = text.replace(
              "through 2300",
              "through 2183"
          )

          text = text.replace(
              "V62 removal-ON/OFF with FaIR-derived harmonized",
              "V63 canonical removal-ON/OFF with FaIR-derived harmonized"
          )

          # --------------------------------------------------
          # 7. There should be no scientific 2300 horizon
          #    left in the V63 isolated copy.
          # --------------------------------------------------

          remaining = [
              line
              for line in text.splitlines()
              if "2300" in line
          ]

          if remaining:
              print(
                  "Unexpected remaining 2300 references:"
              )

              for line in remaining:
                  print(line)

              raise SystemExit(
                  "Unexpected 2300 references remain "
                  "after V63 patch."
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "V63 Hector patch successful."
          )
          PY

          grep -q \
            'match_years <- 2027:2183' \
            hector_work/run_hector_matched_forcing_v63.R

          grep -q \
            'as.numeric(2026:2183)' \
            hector_work/run_hector_matched_forcing_v63.R

          grep -q \
            '2183' \
            hector_work/run_hector_matched_forcing_v63.R

          if grep -q \
            '2300' \
            hector_work/run_hector_matched_forcing_v63.R
          then
            echo "ERROR: 2300 remains in V63 Hector script"
            exit 1
          fi

          echo "V63 Hector horizon patch verified."

      - name: Set up R 4.5.1
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install system libraries for Hector
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-system-dev

      - name: Install Hector 3.5.0
        run: |
          set -euo pipefail

          Rscript -e '
            install.packages(
              c(
                "Rcpp",
                "BH",
                "jsonlite"
              ),
              repos="https://cloud.r-project.org"
            )
          '

          rm -rf /tmp/hector-v3.5.0

          git clone \
            --depth 1 \
            --branch v3.5.0 \
            https://github.com/JGCRI/hector.git \
            /tmp/hector-v3.5.0

          echo \
            "Hector source commit: $(git -C /tmp/hector-v3.5.0 rev-parse HEAD)"

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            /tmp/hector-v3.5.0

          Rscript - <<'RS'
          suppressPackageStartupMessages(
            library(hector)
          )

          suppressPackageStartupMessages(
            library(jsonlite)
          )

          version <- as.character(
            packageVersion("hector")
          )

          cat(
            "Installed Hector:",
            version,
            "\n"
          )

          stopifnot(
            version == "3.5.0"
          )
          RS

      - name: Verify Hector inputs and R syntax
        run: |
          set -euo pipefail

          cd hector_work

          test -f \
            external_validation_net_co2_trajectory.csv

          test -f \
            fair_matched_nonco2_forcing.csv

          test -f \
            run_hector_matched_forcing_v63.R

          Rscript -e '
            parse(
              file="run_hector_matched_forcing_v63.R"
            );
            cat(
              "V63 Hector R syntax OK.\n"
            )
          '

          Rscript - <<'RS'
          traj <- read.csv(
            "external_validation_net_co2_trajectory.csv",
            check.names = FALSE
          )

          forcing <- read.csv(
            "fair_matched_nonco2_forcing.csv",
            check.names = FALSE
          )

          stopifnot(
            nrow(traj) == 158
          )

          stopifnot(
            identical(
              as.numeric(traj$year),
              as.numeric(2026:2183)
            )
          )

          stopifnot(
            nrow(forcing) == 158
          )

          stopifnot(
            identical(
              as.numeric(forcing$year),
              as.numeric(2026:2183)
            )
          )

          stopifnot(
            all(
              is.finite(
                forcing$matched_nonco2_forcing_wm2
              )
            )
          )

          mass <- (
            traj$gross_co2_gtco2 +
            traj$permafrost_co2_gtco2 +
            traj$stored_carbon_reversal_gtco2 -
            traj$cdr_gtco2
          )

          mass_error <- max(
            abs(
              mass -
              traj$net_co2_gtco2
            )
          )

          stopifnot(
            mass_error < 1e-9
          )

          total <- sum(
            traj$cdr_gtco2
          )

          peak <- max(
            traj$cdr_gtco2
          )

          stopifnot(
            abs(
              total -
              2013.8807318595145
            ) < 1e-6
          )

          stopifnot(
            abs(
              peak -
              15.2
            ) < 1e-9
          )

          cat(
            "Trajectory and forcing inputs verified.\n"
          )

          cat(
            "Canonical CDR:",
            total,
            "GtCO2\n"
          )

          cat(
            "Peak CDR:",
            peak,
            "GtCO2/yr\n"
          )
          RS

      - name: Run canonical Hector matched-forcing experiment
        run: |
          set -euo pipefail

          cd hector_work

          set -o pipefail

          Rscript \
            run_hector_matched_forcing_v63.R \
            2>&1 \
            | tee HECTOR_CANONICAL_CONSOLE.log

      - name: Verify canonical Hector results
        run: |
          set -euo pipefail

          cd hector_work

          test -f hector_matched_attribution.csv
          test -f hector_matched_timeseries.csv
          test -f hector_matched_summary.json

          Rscript - <<'RS'
          suppressPackageStartupMessages(
            library(jsonlite)
          )

          s <- read_json(
            "hector_matched_summary.json",
            simplifyVector = TRUE
          )

          a <- read.csv(
            "hector_matched_attribution.csv",
            check.names = FALSE
          )

          z <- read.csv(
            "hector_matched_timeseries.csv",
            check.names = FALSE
          )

          stopifnot(
            s$model == "Hector"
          )

          stopifnot(
            s$version == "3.5.0"
          )

          stopifnot(
            nrow(a) == 158
          )

          stopifnot(
            identical(
              as.numeric(a$year),
              as.numeric(2026:2183)
            )
          )

          stopifnot(
            nrow(z) == 158
          )

          stopifnot(
            identical(
              as.numeric(z$year),
              as.numeric(2026:2183)
            )
          )

          required <- c(
            "year",
            "co2_on_ppm",
            "co2_off_ppm",
            "delta_co2_ppm",
            "cumulative_cdr_gtco2",
            "apparent_response_fraction"
          )

          stopifnot(
            all(
              required %in%
              names(a)
            )
          )

          tol <- as.numeric(
            s$forcing_match_tolerance_wm2
          )

          on_error <- as.numeric(
            s$forcing_match_max_abs_on_wm2
          )

          off_error <- as.numeric(
            s$forcing_match_max_abs_off_wm2
          )

          stopifnot(
            is.finite(tol)
          )

          stopifnot(
            is.finite(on_error)
          )

          stopifnot(
            is.finite(off_error)
          )

          stopifnot(
            on_error <= tol
          )

          stopifnot(
            off_error <= tol
          )

          stopifnot(
            as.numeric(
              s$common_state_2026_co2_abs_error_ppm
            ) <= 1e-8
          )

          stopifnot(
            as.numeric(
              s$common_state_2026_tas_abs_error_c
            ) <= 1e-8
          )

          final <- a[
            a$year == 2183,
          ]

          stopifnot(
            nrow(final) == 1
          )

          terminal_delta <- as.numeric(
            final$delta_co2_ppm
          )

          terminal_fraction <- as.numeric(
            final$apparent_response_fraction
          )

          terminal_cdr <- as.numeric(
            final$cumulative_cdr_gtco2
          )

          stopifnot(
            is.finite(
              terminal_delta
            )
          )

          stopifnot(
            is.finite(
              terminal_fraction
            )
          )

          stopifnot(
            terminal_delta > 0
          )

          stopifnot(
            terminal_fraction > 0
          )

          stopifnot(
            abs(
              terminal_cdr -
              2013.8807318595145
            ) < 1e-6
          )

          stopifnot(
            abs(
              as.numeric(
                s$canonical_cdr_2026_2183_gtco2
              ) -
              2013.8807318595145
            ) < 1e-6
          )

          stopifnot(
            abs(
              as.numeric(
                s$peak_cdr_2026_2183_gtco2_per_year
              ) -
              15.2
            ) < 1e-9
          )

          cat("\n")
          cat(
            "=======================================\n"
          )
          cat(
            "V63 CANONICAL HECTOR EXPERIMENT PASSED\n"
          )
          cat(
            "=======================================\n"
          )

          cat(
            "Hector version:",
            s$version,
            "\n"
          )

          cat(
            "Terminal year:",
            final$year,
            "\n"
          )

          cat(
            "Cumulative CDR:",
            terminal_cdr,
            "GtCO2\n"
          )

          cat(
            "Terminal CO2 reduction:",
            terminal_delta,
            "ppm\n"
          )

          cat(
            "Terminal atmospheric response:",
            terminal_fraction,
            "\n"
          )

          cat(
            "ON forcing error:",
            on_error,
            "W/m2\n"
          )

          cat(
            "OFF forcing error:",
            off_error,
            "W/m2\n"
          )

          cat(
            "Tolerance:",
            tol,
            "W/m2\n"
          )
          RS

      - name: Upload canonical Hector results
        uses: actions/upload-artifact@v7
        with:
          name: V63-Canonical-Hector
          retention-days: 90
          if-no-files-found: error
          path: |
            hector_work/hector_matched_attribution.csv
            hector_work/hector_matched_timeseries.csv
            hector_work/hector_matched_summary.json
            hector_work/HECTOR_CANONICAL_CONSOLE.log
            hector_work/fair_matched_nonco2_forcing.csv
            hector_work/external_validation_net_co2_trajectory.csv
            hector_work/run_hector_matched_forcing_v63.R
