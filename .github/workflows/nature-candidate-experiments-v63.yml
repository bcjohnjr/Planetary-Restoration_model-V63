name: V63 Canonical Hector Experiment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V622_COMMIT: "89a0f4ab18df25db3a05d4e39c6db06405456505"
  FAIR_RUN_ID: "34653255920"

jobs:
  hector-canonical:
    name: Canonical Hector 3.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout V63 repository
        uses: actions/checkout@v7

      - name: Download verified V63 FaIR artifact
        uses: actions/download-artifact@v8
        with:
          name: V63-Canonical-FaIR
          path: fair-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bcjohnjr/Planetary-Restoration_model-V63
          run-id: 34653255920

      - name: Verify downloaded FaIR artifact
        run: |
          set -euo pipefail

          test -f \
            fair-artifact/fair_matched_nonco2_forcing.csv

          test -f \
            fair-artifact/fair_matched_attribution.csv

          test -f \
            fair-artifact/fair_matched_timeseries.csv

          test -f \
            fair-artifact/fair_matched_summary.json

          test -f \
            fair-artifact/external_validation_net_co2_trajectory.csv

          python - <<'PY'
          import json
          import pandas as pd

          forcing = pd.read_csv(
              "fair-artifact/fair_matched_nonco2_forcing.csv"
          )

          trajectory = pd.read_csv(
              "fair-artifact/external_validation_net_co2_trajectory.csv"
          )

          with open(
              "fair-artifact/fair_matched_summary.json",
              encoding="utf-8",
          ) as f:
              summary = json.load(f)

          assert summary["model"] == "FaIR"
          assert summary["version"] == "2.2.4"
          assert summary["configs"] == 841

          assert len(forcing) == 158
          assert int(forcing["year"].iloc[0]) == 2026
          assert int(forcing["year"].iloc[-1]) == 2183

          assert len(trajectory) == 158
          assert int(trajectory["year"].iloc[0]) == 2026
          assert int(trajectory["year"].iloc[-1]) == 2183

          total = float(
              trajectory["cdr_gtco2"].sum()
          )

          peak = float(
              trajectory["cdr_gtco2"].max()
          )

          assert abs(
              total - 2013.8807318595145
          ) < 1e-6

          assert abs(
              peak - 15.2
          ) < 1e-9

          tol = float(
              summary[
                  "forcing_match_tolerance_wm2"
              ]
          )

          on_error = float(
              summary[
                  "forcing_match_max_abs_on_wm2"
              ]
          )

          off_error = float(
              summary[
                  "forcing_match_max_abs_off_wm2"
              ]
          )

          assert on_error <= tol
          assert off_error <= tol

          print(
              "Verified FaIR artifact from run 34653255920"
          )
          print(
              "Forcing years:",
              int(forcing["year"].iloc[0]),
              "-",
              int(forcing["year"].iloc[-1]),
          )
          print(
              "Canonical CDR:",
              total,
              "GtCO2"
          )
          print(
              "Peak CDR:",
              peak,
              "GtCO2/yr"
          )
          print(
              "FaIR ON forcing error:",
              on_error
          )
          print(
              "FaIR OFF forcing error:",
              off_error
          )
          PY

      - name: Restore proven V62.2 Hector script
        run: |
          set -euo pipefail

          V622_DIR="/tmp/V62.2"

          rm -rf "$V622_DIR"

          git clone \
            https://github.com/bcjohnjr/Planetary-Restoration-Version-62.2.git \
            "$V622_DIR"

          git -C "$V622_DIR" checkout \
            --detach \
            "$V622_COMMIT"

          ACTUAL="$(
            git -C "$V622_DIR" rev-parse HEAD
          )"

          test "$ACTUAL" = "$V622_COMMIT"

          test -f \
            "$V622_DIR/run_hector_matched_forcing_v62.R"

          mkdir -p hector_work

          cp \
            "$V622_DIR/run_hector_matched_forcing_v62.R" \
            hector_work/run_hector_matched_forcing_v63.R

          cp \
            fair-artifact/fair_matched_nonco2_forcing.csv \
            hector_work/

          cp \
            fair-artifact/external_validation_net_co2_trajectory.csv \
            hector_work/

          echo "Pinned V62.2 Hector script restored."

      - name: Convert isolated Hector experiment to true 2183 horizon
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          p = Path(
              "hector_work/"
              "run_hector_matched_forcing_v63.R"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          before = text.count("2300")

          if before == 0:
              raise SystemExit(
                  "Expected V62.2 script to contain "
                  "2300 horizon references."
              )

          # Every literal 2300 in this isolated script
          # refers to the old post-2183 extension horizon.
          # V63 schedule experiments terminate at the
          # actual canonical pathway boundary of 2183.
          text = text.replace(
              "2300",
              "2183"
          )

          if "2300" in text:
              raise SystemExit(
                  "A 2300 horizon reference remains."
              )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Converted",
              before,
              "2300 horizon references to 2183."
          )
          PY

          grep -q \
            'match_years <- 2027:2183' \
            hector_work/run_hector_matched_forcing_v63.R

          grep -q \
            'as.numeric(2026:2183)' \
            hector_work/run_hector_matched_forcing_v63.R

          if grep -q '2300' \
            hector_work/run_hector_matched_forcing_v63.R
          then
            echo "ERROR: 2300 remains in Hector script"
            exit 1
          fi

          echo "V63 Hector horizon patch verified."

      - name: Set up R 4.5.1
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install system libraries for Hector
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-system-dev

      - name: Install Hector 3.5.0
        run: |
          set -euo pipefail

          Rscript -e '
            install.packages(
              c(
                "Rcpp",
                "BH",
                "jsonlite"
              ),
              repos="https://cloud.r-project.org"
            )
          '

          rm -rf /tmp/hector-v3.5.0

          git clone \
            --depth 1 \
            --branch v3.5.0 \
            https://github.com/JGCRI/hector.git \
            /tmp/hector-v3.5.0

          HECTOR_COMMIT="$(
            git -C /tmp/hector-v3.5.0 \
            rev-parse HEAD
          )"

          echo \
            "Hector v3.5.0 commit: $HECTOR_COMMIT"

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            /tmp/hector-v3.5.0

          Rscript - <<'RS'
          library(hector)
          library(jsonlite)

          v <- as.character(
            packageVersion("hector")
          )

          cat(
            "Installed Hector version:",
            v,
            "\n"
          )

          stopifnot(
            v == "3.5.0"
          )
          RS

      - name: Verify Hector inputs and R syntax
        run: |
          set -euo pipefail

          cd hector_work

          test -f \
            external_validation_net_co2_trajectory.csv

          test -f \
            fair_matched_nonco2_forcing.csv

          test -f \
            run_hector_matched_forcing_v63.R

          Rscript -e '
            parse(
              file="run_hector_matched_forcing_v63.R"
            );
            cat(
              "Hector V63 R script parses successfully.\n"
            )
          '

          Rscript - <<'RS'
          traj <- read.csv(
            "external_validation_net_co2_trajectory.csv",
            check.names = FALSE
          )

          forcing <- read.csv(
            "fair_matched_nonco2_forcing.csv",
            check.names = FALSE
          )

          stopifnot(
            min(traj$year) == 2026
          )

          stopifnot(
            max(traj$year) == 2183
          )

          stopifnot(
            nrow(traj) == 158
          )

          stopifnot(
            min(forcing$year) == 2026
          )

          stopifnot(
            max(forcing$year) == 2183
          )

          stopifnot(
            nrow(forcing) == 158
          )

          stopifnot(
            all(
              is.finite(
                forcing$matched_nonco2_forcing_wm2
              )
            )
          )

          cat(
            "Hector V63 inputs verified.\n"
          )
          RS

      - name: Run canonical Hector matched-forcing experiment
        run: |
          set -euo pipefail

          cd hector_work

          set -o pipefail

          Rscript \
            run_hector_matched_forcing_v63.R \
            2>&1 \
            | tee HECTOR_CANONICAL_CONSOLE.log

      - name: Verify canonical Hector results
        run: |
          set -euo pipefail

          cd hector_work

          test -f \
            hector_matched_attribution.csv

          test -f \
            hector_matched_timeseries.csv

          test -f \
            hector_matched_summary.json

          Rscript - <<'RS'
          suppressPackageStartupMessages(
            library(jsonlite)
          )

          s <- read_json(
            "hector_matched_summary.json",
            simplifyVector = TRUE
          )

          a <- read.csv(
            "hector_matched_attribution.csv",
            check.names = FALSE
          )

          z <- read.csv(
            "hector_matched_timeseries.csv",
            check.names = FALSE
          )

          stopifnot(
            s$model == "Hector"
          )

          stopifnot(
            s$version == "3.5.0"
          )

          tol <- as.numeric(
            s$forcing_match_tolerance_wm2
          )

          on_error <- as.numeric(
            s$forcing_match_max_abs_on_wm2
          )

          off_error <- as.numeric(
            s$forcing_match_max_abs_off_wm2
          )

          stopifnot(
            is.finite(tol)
          )

          stopifnot(
            is.finite(on_error)
          )

          stopifnot(
            is.finite(off_error)
          )

          stopifnot(
            on_error <= tol
          )

          stopifnot(
            off_error <= tol
          )

          stopifnot(
            min(z$year) == 2026
          )

          stopifnot(
            max(z$year) == 2183
          )

          stopifnot(
            nrow(z) == 158
          )

          stopifnot(
            max(a$year) == 2183
          )

          final <- a[
            which.max(a$year),
          ]

          stopifnot(
            is.finite(
              final$delta_co2_ppm
            )
          )

          stopifnot(
            is.finite(
              final$response_fraction
            )
          )

          stopifnot(
            final$delta_co2_ppm > 0
          )

          stopifnot(
            final$response_fraction > 0
          )

          cat("\n")
          cat(
            "=======================================\n"
          )
          cat(
            "V63 CANONICAL HECTOR EXPERIMENT PASSED\n"
          )
          cat(
            "=======================================\n"
          )

          cat(
            "Hector version:",
            s$version,
            "\n"
          )

          cat(
            "Terminal year:",
            final$year,
            "\n"
          )

          cat(
            "Terminal CO2 reduction:",
            final$delta_co2_ppm,
            "ppm\n"
          )

          cat(
            "Terminal atmospheric response:",
            final$response_fraction,
            "\n"
          )

          cat(
            "ON forcing error:",
            on_error,
            "W/m2\n"
          )

          cat(
            "OFF forcing error:",
            off_error,
            "W/m2\n"
          )

          cat(
            "Tolerance:",
            tol,
            "W/m2\n"
          )
          RS

      - name: Upload canonical Hector results
        uses: actions/upload-artifact@v7
        with:
          name: V63-Canonical-Hector
          retention-days: 90
          if-no-files-found: error
          path: |
            hector_work/hector_matched_attribution.csv
            hector_work/hector_matched_timeseries.csv
            hector_work/hector_matched_summary.json
            hector_work/HECTOR_CANONICAL_CONSOLE.log
            hector_work/fair_matched_nonco2_forcing.csv
            hector_work/external_validation_net_co2_trajectory.csv
            hector_work/run_hector_matched_forcing_v63.R
