name: V63 Canonical Hector Experiment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V622_COMMIT: "89a0f4ab18df25db3a05d4e39c6db06405456505"

jobs:
  hector-canonical:
    name: Canonical Hector 3.5.0
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout V63 repository
        uses: actions/checkout@v7

      - name: Download verified V63 FaIR artifact
        uses: actions/download-artifact@v8
        with:
          name: V63-Canonical-FaIR
          path: fair-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: bcjohnjr/Planetary-Restoration_model-V63
          run-id: 34653255920

      - name: Verify downloaded FaIR artifact
        run: |
          set -euo pipefail

          test -f fair-artifact/fair_matched_nonco2_forcing.csv
          test -f fair-artifact/fair_matched_attribution.csv
          test -f fair-artifact/fair_matched_timeseries.csv
          test -f fair-artifact/fair_matched_summary.json
          test -f fair-artifact/external_validation_net_co2_trajectory.csv

          python - <<'PY'
          import csv
          import json

          with open(
              "fair-artifact/fair_matched_summary.json",
              encoding="utf-8",
          ) as f:
              summary = json.load(f)

          with open(
              "fair-artifact/fair_matched_nonco2_forcing.csv",
              newline="",
              encoding="utf-8",
          ) as f:
              forcing = list(csv.DictReader(f))

          with open(
              "fair-artifact/external_validation_net_co2_trajectory.csv",
              newline="",
              encoding="utf-8",
          ) as f:
              trajectory = list(csv.DictReader(f))

          assert summary["model"] == "FaIR"
          assert summary["version"] == "2.2.4"
          assert summary["configs"] == 841

          assert len(forcing) == 158
          assert int(float(forcing[0]["year"])) == 2026
          assert int(float(forcing[-1]["year"])) == 2183

          assert len(trajectory) == 158
          assert int(float(trajectory[0]["year"])) == 2026
          assert int(float(trajectory[-1]["year"])) == 2183

          total = sum(
              float(row["cdr_gtco2"])
              for row in trajectory
          )

          peak = max(
              float(row["cdr_gtco2"])
              for row in trajectory
          )

          assert abs(
              total - 2013.8807318595145
          ) < 1e-6

          assert abs(
              peak - 15.2
          ) < 1e-9

          tol = float(
              summary["forcing_match_tolerance_wm2"]
          )

          on_error = float(
              summary["forcing_match_max_abs_on_wm2"]
          )

          off_error = float(
              summary["forcing_match_max_abs_off_wm2"]
          )

          assert on_error <= tol
          assert off_error <= tol

          print(
              "Verified FaIR artifact from green run 34653255920"
          )
          print(
              "Forcing horizon: 2026-2183"
          )
          print(
              "Canonical CDR:",
              total,
              "GtCO2"
          )
          print(
              "Peak CDR:",
              peak,
              "GtCO2/yr"
          )
          print(
              "FaIR ON forcing error:",
              on_error
          )
          print(
              "FaIR OFF forcing error:",
              off_error
          )
          PY

      - name: Restore proven V62.2 Hector script
        run: |
          set -euo pipefail

          V622_DIR="/tmp/V62.2"

          rm -rf "$V622_DIR"

          git clone \
            https://github.com/bcjohnjr/Planetary-Restoration-Version-62.2.git \
            "$V622_DIR"

          git -C "$V622_DIR" checkout \
            --detach \
            "$V622_COMMIT"

          ACTUAL="$(
            git -C "$V622_DIR" rev-parse HEAD
          )"

          test "$ACTUAL" = "$V622_COMMIT"

          test -f \
            "$V622_DIR/run_hector_matched_forcing_v62.R"

          rm -rf hector_work
          mkdir -p hector_work

          cp \
            "$V622_DIR/run_hector_matched_forcing_v62.R" \
            hector_work/run_hector_matched_forcing_v63.R

          cp \
            fair-artifact/fair_matched_nonco2_forcing.csv \
            hector_work/

          cp \
            fair-artifact/external_validation_net_co2_trajectory.csv \
            hector_work/

          echo "Pinned V62.2 Hector script restored."

      - name: Patch Hector only for V63 2183 horizon
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          p = Path(
              "hector_work/run_hector_matched_forcing_v63.R"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          old_extension = """last <- x[nrow(x), ]

          if (max(x$year) < 2300) {

            yy <- (max(x$year) + 1L):2300L

            ext <- data.frame(
              year = yy,
              gross_co2_gtco2 =
                rep(last$gross_co2_gtco2, length(yy)),
              permafrost_co2_gtco2 =
                rep(last$permafrost_co2_gtco2, length(yy)),
              stored_carbon_reversal_gtco2 =
                rep(last$stored_carbon_reversal_gtco2, length(yy)),
              cdr_gtco2 =
                rep(last$cdr_gtco2, length(yy)),
              net_co2_gtco2 =
                rep(last$net_co2_gtco2, length(yy))
            )

            x <- rbind(
              x[, names(ext)],
              ext
            )
          }

          yrs <- as.numeric(x$year)"""

          new_extension = """yrs <- as.numeric(x$year)"""

          if old_extension not in text:
              raise SystemExit(
                  "Could not locate old 2183-to-2300 "
                  "trajectory extension block."
              )

          text = text.replace(
              old_extension,
              new_extension,
              1,
          )

          replacements = {
              "as.numeric(2026:2300)":
                  "as.numeric(2026:2183)",

              "Extended trajectory must be annual 2026-2300":
                  "Trajectory must be annual 2026-2183",

              "match_years <- 2027:2300":
                  "match_years <- 2027:2183",

              "Common non-CO2 forcing target missing/non-finite over 2027-2300":
                  "Common non-CO2 forcing target missing/non-finite over 2027-2183",

              "run(\n      core,\n      2300\n    )":
                  "run(\n      core,\n      2183\n    )",

              """yy in c(
              2040,
              2100,
              2156,
              2184,
              2200,
              2300
            )""":
                  """yy in c(
              2040,
              2100,
              2156,
              2183
            )""",

              "target for 2027-2300.":
                  "target for 2027-2183.",

              "V62 removal-ON/OFF with FaIR-derived harmonized":
                  "V63 canonical removal-ON/OFF with FaIR-derived harmonized",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(
                      "Required patch target not found:\n"
                      + old
                  )

              text = text.replace(
                  old,
                  new,
                  1,
              )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "V63 Hector horizon patch completed."
          )
          PY

          grep -q \
            'match_years <- 2027:2183' \
            hector_work/run_hector_matched_forcing_v63.R

          grep -q \
            'as.numeric(2026:2183)' \
            hector_work/run_hector_matched_forcing_v63.R

          grep -q \
            '2183' \
            hector_work/run_hector_matched_forcing_v63.R

          if grep -q \
            'match_years <- 2027:2300' \
            hector_work/run_hector_matched_forcing_v63.R
          then
            echo "ERROR: old forcing horizon remains"
            exit 1
          fi

          echo "V63 Hector horizon verified."

      - name: Set up R 4.5.1
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install system libraries for Hector
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-system-dev

      - name: Install Hector 3.5.0
        run: |
          set -euo pipefail

          Rscript -e '
            install.packages(
              c(
                "Rcpp",
                "BH",
                "jsonlite"
              ),
              repos="https://cloud.r-project.org"
            )
          '

          rm -rf /tmp/hector-v3.5.0

          git clone \
            --depth 1 \
            --branch v3.5.0 \
            https://github.com/JGCRI/hector.git \
            /tmp/hector-v3.5.0

          HECTOR_COMMIT="$(
            git -C /tmp/hector-v3.5.0 \
            rev-parse HEAD
          )"

          echo \
            "Hector v3.5.0 commit: $HECTOR_COMMIT"

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            /tmp/hector-v3.5.0

          Rscript - <<'RS'
          suppressPackageStartupMessages(
            library(hector)
          )

          suppressPackageStartupMessages(
            library(jsonlite)
          )

          v <- as.character(
            packageVersion("hector")
          )

          cat(
            "Installed Hector version:",
            v,
            "\n"
          )

          stopifnot(
            v == "3.5.0"
          )
          RS

      - name: Verify Hector inputs and R syntax
        run: |
          set -euo pipefail

          cd hector_work

          test -f \
            external_validation_net_co2_trajectory.csv

          test -f \
            fair_matched_nonco2_forcing.csv

          test -f \
            run_hector_matched_forcing_v63.R

          Rscript -e '
            parse(
              file="run_hector_matched_forcing_v63.R"
            );
            cat(
              "Hector V63 R script parses successfully.\n"
            )
          '

          Rscript - <<'RS'
          traj <- read.csv(
            "external_validation_net_co2_trajectory.csv",
            check.names = FALSE
          )

          forcing <- read.csv(
            "fair_matched_nonco2_forcing.csv",
            check.names = FALSE
          )

          stopifnot(
            nrow(traj) == 158
          )

          stopifnot(
            min(traj$year) == 2026
          )

          stopifnot(
            max(traj$year) == 2183
          )

          stopifnot(
            nrow(forcing) == 158
          )

          stopifnot(
            min(forcing$year) == 2026
          )

          stopifnot(
            max(forcing$year) == 2183
          )

          stopifnot(
            all(
              is.finite(
                forcing$
                  matched_nonco2_forcing_wm2
              )
            )
          )

          mass <- (
            traj$gross_co2_gtco2 +
            traj$permafrost_co2_gtco2 +
            traj$stored_carbon_reversal_gtco2 -
            traj$cdr_gtco2
          )

          mass_error <- max(
            abs(
              mass -
              traj$net_co2_gtco2
            )
          )

          stopifnot(
            mass_error < 1e-9
          )

          total <- sum(
            traj$cdr_gtco2
          )

          peak <- max(
            traj$cdr_gtco2
          )

          stopifnot(
            abs(
              total -
              2013.8807318595145
            ) < 1e-6
          )

          stopifnot(
            abs(
              peak -
              15.2
            ) < 1e-9
          )

          cat(
            "Hector inputs verified.\n"
          )

          cat(
            "Mass-balance error:",
            mass_error,
            "\n"
          )

          cat(
            "Canonical CDR:",
            total,
            "GtCO2\n"
          )

          cat(
            "Peak CDR:",
            peak,
            "GtCO2/yr\n"
          )
          RS

      - name: Run canonical Hector matched-forcing experiment
        run: |
          set -euo pipefail

          cd hector_work

          set -o pipefail

          Rscript \
            run_hector_matched_forcing_v63.R \
            2>&1 \
            | tee HECTOR_CANONICAL_CONSOLE.log

      - name: Verify canonical Hector results
        run: |
          set -euo pipefail

          cd hector_work

          test -f hector_matched_attribution.csv
          test -f hector_matched_timeseries.csv
          test -f hector_matched_summary.json

          Rscript - <<'RS'
          suppressPackageStartupMessages(
            library(jsonlite)
          )

          s <- read_json(
            "hector_matched_summary.json",
            simplifyVector = TRUE
          )

          a <- read.csv(
            "hector_matched_attribution.csv",
            check.names = FALSE
          )

          z <- read.csv(
            "hector_matched_timeseries.csv",
            check.names = FALSE
          )

          stopifnot(
            s$model == "Hector"
          )

          stopifnot(
            s$version == "3.5.0"
          )

          stopifnot(
            nrow(a) == 158
          )

          stopifnot(
            min(a$year) == 2026
          )

          stopifnot(
            max(a$year) == 2183
          )

          stopifnot(
            nrow(z) == 158
          )

          stopifnot(
            min(z$year) == 2026
          )

          stopifnot(
            max(z$year) == 2183
          )

          required_attr <- c(
            "year",
            "co2_on_ppm",
            "co2_off_ppm",
            "delta_co2_ppm",
            "cumulative_cdr_gtco2",
            "apparent_response_fraction"
          )

          stopifnot(
            all(
              required_attr %in%
              names(a)
            )
          )

          tol <- as.numeric(
            s$forcing_match_tolerance_wm2
          )

          on_error <- as.numeric(
            s$forcing_match_max_abs_on_wm2
          )

          off_error <- as.numeric(
            s$forcing_match_max_abs_off_wm2
          )

          stopifnot(
            is.finite(tol)
          )

          stopifnot(
            is.finite(on_error)
          )

          stopifnot(
            is.finite(off_error)
          )

          stopifnot(
            on_error <= tol
          )

          stopifnot(
            off_error <= tol
          )

          stopifnot(
            as.numeric(
              s$common_state_2026_co2_abs_error_ppm
            ) <= 1e-8
          )

          stopifnot(
            as.numeric(
              s$common_state_2026_tas_abs_error_c
            ) <= 1e-8
          )

          final <- a[
            a$year == 2183,
          ]

          stopifnot(
            nrow(final) == 1
          )

          terminal_delta <- as.numeric(
            final$delta_co2_ppm
          )

          terminal_fraction <- as.numeric(
            final$apparent_response_fraction
          )

          terminal_cdr <- as.numeric(
            final$cumulative_cdr_gtco2
          )

          stopifnot(
            is.finite(
              terminal_delta
            )
          )

          stopifnot(
            is.finite(
              terminal_fraction
            )
          )

          stopifnot(
            is.finite(
              terminal_cdr
            )
          )

          stopifnot(
            terminal_delta > 0
          )

          stopifnot(
            terminal_fraction > 0
          )

          stopifnot(
            abs(
              terminal_cdr -
              2013.8807318595145
            ) < 1e-6
          )

          stopifnot(
            abs(
              as.numeric(
                s$canonical_cdr_2026_2183_gtco2
              ) -
              2013.8807318595145
            ) < 1e-6
          )

          stopifnot(
            abs(
              as.numeric(
                s$peak_cdr_2026_2183_gtco2_per_year
              ) -
              15.2
            ) < 1e-9
          )

          cat("\n")
          cat(
            "=======================================\n"
          )
          cat(
            "V63 CANONICAL HECTOR EXPERIMENT PASSED\n"
          )
          cat(
            "=======================================\n"
          )

          cat(
            "Hector version:",
            s$version,
            "\n"
          )

          cat(
            "Terminal year:",
            final$year,
            "\n"
          )

          cat(
            "Cumulative CDR:",
            terminal_cdr,
            "GtCO2\n"
          )

          cat(
            "Terminal CO2 reduction:",
            terminal_delta,
            "ppm\n"
          )

          cat(
            "Terminal atmospheric response:",
            terminal_fraction,
            "\n"
          )

          cat(
            "ON forcing error:",
            on_error,
            "W/m2\n"
          )

          cat(
            "OFF forcing error:",
            off_error,
            "W/m2\n"
          )

          cat(
            "Tolerance:",
            tol,
            "W/m2\n"
          )
          RS

      - name: Upload canonical Hector results
        uses: actions/upload-artifact@v7
        with:
          name: V63-Canonical-Hector
          retention-days: 90
          if-no-files-found: error
          path: |
            hector_work/hector_matched_attribution.csv
            hector_work/hector_matched_timeseries.csv
            hector_work/hector_matched_summary.json
            hector_work/HECTOR_CANONICAL_CONSOLE.log
            hector_work/fair_matched_nonco2_forcing.csv
            hector_work/external_validation_net_co2_trajectory.csv
            hector_work/run_hector_matched_forcing_v63.R
